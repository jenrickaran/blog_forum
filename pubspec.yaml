name: flutter_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  go_router: ^17.3.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  provider: ^6.1.5+1
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Google-Sans
      fonts:
        - asset: assets/fonts/static/GoogleSans_17pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/GoogleSans_17pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/GoogleSans_17pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/GoogleSans_17pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/GoogleSans_17pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/static/GoogleSans_17pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/static/GoogleSans_17pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/static/GoogleSans_17pt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/static/GoogleSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/static/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/static/GoogleSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/static/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic
